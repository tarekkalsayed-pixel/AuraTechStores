<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Tech History</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="nav">
    <div class="logo">Aura <span>Tech</span> History</div>
    <div class="nav-actions">
        <a th:href="@{/admin/home}">Admin Home</a>
        <form th:action="@{/logout}" method="post" class="nav-form">
            <button type="submit" class="nav-button">Logout</button>
        </form>
    </div>
</div>
<section class="hero">
    <p class="eyebrow">AUDIT TRAIL</p>
    <h1>Operations history.</h1>
    <p>Track catalog changes and offer-email activity performed inside the admin console.</p>
</section>
<div class="container">
    <table>
        <thead>
        <tr>
            <th>User</th>
            <th>Action</th>
            <th>Details</th>
            <th>Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${history}">
            <td th:text="${h.username}">User</td>
            <td th:text="${h.action}">Action</td>
            <td th:text="${h.details}">Details</td>
            <td th:text="${h.createdAt}">Date</td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/cookie-consent.js}"></script>
</body>
</html>
