<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Tech Admin Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="nav">
    <div class="logo">Aura <span>Tech</span> Admin</div>
    <div class="nav-actions">
        <a th:href="@{/admin/home}">Home</a>
        <a th:href="@{/admin/history}">History</a>
        <form th:action="@{/logout}" method="post" class="nav-form">
            <button type="submit" class="nav-button">Logout</button>
        </form>
    </div>
</div>
<div class="form-box">
    <p class="eyebrow dark">ADMIN ACCOUNT</p>
    <h1>Profile</h1>
    <p><b>Username:</b> <span th:text="${user.username}">username</span></p>
    <p><b>Email:</b> <span th:text="${user.email}">email</span></p>
    <p><b>Role:</b> <span th:text="${user.role}">role</span></p>
    <p class="note">Administrators can manage products, branch stock, discounts, operation history, and offer emails.</p>
</div>
<script th:src="@{/js/cookie-consent.js}"></script>
</body>
</html>
