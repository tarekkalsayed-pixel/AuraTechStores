server.port=${PORT:8086}

# Local development database
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/aura}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Development tooling. Enable explicitly only for local development.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Mail configuration. Never commit SMTP credentials.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:auratechstores@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
